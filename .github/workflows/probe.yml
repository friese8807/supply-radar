name: probe
on: { push: { branches: [probe-naver] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node probe.cjs
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "data [skip ci]" -- kospi.json 2>/dev/null || (git add kospi.json && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "data [skip ci]")
          git push -q
