name: probe
on: { push: { branches: [probe-naver] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          git fetch --depth 1 origin data && git show FETCH_HEAD:map.json > map.json
          start=$(date +%s); node detail.cjs outd map.json; echo "took $(( $(date +%s)-start ))s"
          du -sh outd; ls outd/d | wc -l
          mkdir -p sample && cp outd/d/005930.json outd/d/000660.json outd/d/196170.json sample/ 2>/dev/null; ls -la sample
          git add sample && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "sample [skip ci]" && git push -q
