name: 수급 레이더 데이터

# 장중(평일 08:50~15:45)에는 1분마다 수급을 받아 data 브랜치에 올립니다.
# 실행이 끝날 때마다 다음 실행을 스스로 걸어 계속 이어집니다. 아래 예약은 이어짐이 끊겼을 때 다시 살리는 예비용입니다.
on:
  schedule:
    - cron: '50 23 * * 0-4'   # 08:50 KST
    - cron: '10 0 * * 1-5'    # 09:10
    - cron: '0 2 * * 1-5'     # 11:00
    - cron: '0 4 * * 1-5'     # 13:00
    - cron: '45 5 * * 1-5'    # 14:45 (6시간 제한 대비 이어 달리기)
    - cron: '7,37 0-5 * * 1-5'  # 09:07~14:37 30분마다 (예약이 빠지는 날 대비, 이미 돌고 있으면 바로 끝남)
    - cron: '0 7,10,13 * * 1-5'  # 마감 뒤 확정치
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write   # 다음 실행을 스스로 걸기 위해

concurrency:
  group: supply-radar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 이전 데이터 받기 (장중 흐름 이어 쌓기)
        run: |
          git fetch --depth 1 origin data || true
          git show FETCH_HEAD:data.json > prev.json || echo '{}' > prev.json
          git show FETCH_HEAD:map.json > prevmap.json || echo '{}' > prevmap.json
          git show FETCH_HEAD:sectors.json > prevsec.json || echo '{}' > prevsec.json
      - name: 1분마다 받아서 올리기 + 다음 실행 이어 걸기
        env:
          TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # GitHub 예약 실행은 몇 시간씩 늦거나 빠지는 날이 많아서, 실행 하나가 끝날 때 다음 실행을 직접 걸어
          # 쉬지 않고 이어지게 합니다. 장이 없을 때는 다음 평일 08:50까지 기다리기만 합니다(공개 저장소라 무료).
          K() { TZ=Asia/Seoul date "$@"; }
          mkdir -p out
          fetch_once() {
            if node fetch.cjs out prev.json; then
              cp out/data.json prev.json
              [ -f out/map.json ] && cp out/map.json prevmap.json
              [ -f out/sectors.json ] && cp out/sectors.json prevsec.json
              ( cd out && rm -rf .git && git init -q -b data && git add data.json $(ls map.json sectors.json 2>/dev/null) \
                && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "data $(date -u +%FT%TZ)" \
                && git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data ) || echo "올리기 실패, 다음 회차에 다시"
            fi
          }
          now=$(date +%s); deadline=$((now + 335*60))
          fetch_once   # 마감 뒤 확정치도 이걸로 갱신
          # 다음 장 시작(오늘 장중이면 지금)
          day=""
          for d in 0 1 2 3 4 5 6; do
            dd=$(K -d "+$d day" +%F)
            [ "$(K -d "$dd" +%u)" -le 5 ] || continue
            [ "$(K -d "$dd 15:45" +%s)" -gt "$now" ] && { day=$dd; break; }
          done
          start=$(K -d "$day 08:50" +%s); stop=$(K -d "$day 15:45" +%s)
          [ "$start" -lt "$now" ] && start=$now
          [ "$stop" -gt "$deadline" ] && stop=$deadline
          echo "다음 장: $day, 시작 $(K -d @$start +%T), 끝 $(K -d @$stop +%T)"
          if [ "$start" -lt "$deadline" ]; then
            [ "$start" -gt "$(date +%s)" ] && sleep $((start - $(date +%s)))
            while [ "$(date +%s)" -lt "$stop" ]; do fetch_once; sleep 55; done
            fetch_once
          else
            sleep $((deadline - $(date +%s)))
          fi
          gh workflow run data.yml -R "$REPO" --ref main && echo "다음 실행을 걸었습니다"
