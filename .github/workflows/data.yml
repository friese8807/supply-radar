name: 수급 레이더 데이터

# 장중에는 한 번 시작되면 장 마감(15:45)까지 1분마다 수급을 받아 data 브랜치에 올립니다.
# GitHub 예약 실행이 늦거나 빠질 수 있어 시작 시각을 여러 번 걸어 두었습니다(이미 돌고 있으면 기다렸다가 짧게 끝남).
on:
  schedule:
    - cron: '50 23 * * 0-4'   # 08:50 KST
    - cron: '10 0 * * 1-5'    # 09:10
    - cron: '0 2 * * 1-5'     # 11:00
    - cron: '0 4 * * 1-5'     # 13:00
    - cron: '45 5 * * 1-5'    # 14:45 (6시간 제한 대비 이어 달리기)
    - cron: '0 7,10,13 * * 1-5'  # 마감 뒤 확정치
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: supply-radar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 이전 데이터 받기 (장중 흐름 이어 쌓기)
        run: git fetch --depth 1 origin data && git show FETCH_HEAD:data.json > prev.json || echo '{}' > prev.json
      - name: 장 마감까지 1분마다 받아서 올리기
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          start=$(date +%s)
          stop=$(TZ=Asia/Seoul date -d '15:45' +%s)
          limit=$((start + 345*60))
          [ "$limit" -lt "$stop" ] && stop=$limit
          mkdir -p out
          while :; do
            if node fetch.cjs out prev.json; then
              cp out/data.json prev.json
              ( cd out && rm -rf .git && git init -q -b data && git add data.json \
                && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "data $(date -u +%FT%TZ)" \
                && git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data ) || echo "올리기 실패, 다음 회차에 다시"
            fi
            [ "$(date +%s)" -ge "$stop" ] && break
            sleep 55
          done
